name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev extras
        run: pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest, offline)
        run: pytest tests/ -q
        env:
          HF_HUB_OFFLINE: "1"  # tests must never touch the network or download models
